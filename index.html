<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STRAFE — Nacht (MVP kill loop)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen {
    display: block;
    width: 100vw; height: 100vh;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;            /* we draw our own crosshair at the pointer position */
  }
  #hud {
    position: fixed; top: 14px; left: 16px; pointer-events: none;
    color: #ffd54a; text-shadow: 0 2px 4px #000;
  }
  #points {
    font: 800 34px ui-monospace, Menlo, Consolas, monospace; line-height: 1;
    letter-spacing: 1px; transform-origin: left center;
  }
  #points.pop { animation: pop .18s ease-out; }
  @keyframes pop { 0% { transform: scale(1.6); color: #fff; } 100% { transform: scale(1); } }
  #round { margin-top: 6px; font: 700 13px ui-monospace, monospace; color: #b98; letter-spacing: 3px; }
  #round b { color: #e23b2e; }
  #ammo {
    position: fixed; right: 18px; bottom: 16px; text-align: right; pointer-events: none;
    color: #fff; text-shadow: 0 2px 4px #000; font: 800 40px ui-monospace, monospace; line-height: .85;
  }
  #ammo small { font-size: 18px; color: #9ab; }
  #ammo.empty #mag { color: #e44; }
  #ammo #weapon { font: 700 11px ui-monospace, monospace; color: #ffd54a; letter-spacing: 2px; margin-bottom: 3px; }
  #lowhp {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(ellipse at center, rgba(120,0,0,0) 42%, rgba(120,0,0,.6) 100%);
  }
  #lowhp.show { opacity: 1; animation: heartbeat 1.1s ease-in-out infinite; }
  @keyframes heartbeat { 0%, 100% { opacity: .45; } 50% { opacity: .95; } }
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: .5; mix-blend-mode: multiply;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0, rgba(0,0,0,.18) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.4) 100%);
  }
  #hint {
    position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
    font: 12px ui-monospace, monospace; color: #89a; text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
  #overlay {
    position: fixed; inset: 0; display: none; z-index: 70;
    flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: rgba(25, 0, 0, 0.55);
    color: #e44; font: 700 30px ui-monospace, monospace; text-shadow: 0 2px 6px #000;
    letter-spacing: 2px;
  }
  #overlay.show { display: flex; }
  #overlay small { color: #d9b3b3; font-weight: 400; font-size: 14px; letter-spacing: 0; }
</style>
</head>
<body>
  <canvas id="screen" width="320" height="200"></canvas>
  <div id="lowhp"></div>
  <div id="hud"><div id="points">0</div><div id="round">ROUND <b>1</b></div></div>
  <div id="ammo"><div id="weapon"></div><span id="mag">0</span> <small id="reserve">/ 0</small></div>
  <div id="hint">WASD move &nbsp;·&nbsp; mouse aims the gun &nbsp;·&nbsp; screen edges turn &nbsp;·&nbsp; click / hold to shoot &nbsp;·&nbsp; R reload</div>
  <div id="overlay"></div>
  <div id="crt"></div>

  <script type="module">
  // ---------------------------------------------------------------------------
  // index.html is the *integration layer*: input, rendering, and the game loop.
  // It contains NO game rules — every rule (chase, fire cadence, hit detection,
  // damage, scoring, projection) lives in the unit-tested pure modules in src/.
  // This file only wires those functions to the canvas and keyboard/mouse.
  // ---------------------------------------------------------------------------
  import { MAP, MAP_W, MAP_H, castRay, moveWithCollision } from "./src/engine.js";
  import { stepZombie } from "./src/game.js";
  import { WEAPONS, fire as fireWeapon, startReload, tickReload } from "./src/weapons.js";
  import { resolveShot } from "./src/shooting.js";
  import { applyContactDamage, regen, isGameOver } from "./src/survival.js";
  import { earn } from "./src/economy.js";
  import { projectSprites, projectSprite } from "./src/sprites.js";
  import { tickShake, shakeOffset } from "./src/shake.js";
  import { spawnPopup, tickPopups } from "./src/popups.js";
  import { spawnBloodPuff, spawnSpark, tickParticles } from "./src/particles.js";

  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById("overlay");
  const pointsEl = document.getElementById("points");
  const roundEl = document.getElementById("round");
  const ammoEl = document.getElementById("ammo");
  const magEl = document.getElementById("mag");
  const reserveEl = document.getElementById("reserve");
  const weaponEl = document.getElementById("weapon");
  const lowhpEl = document.getElementById("lowhp");
  let lastPoints = -1;

  // Cached gradients for the sky/floor backdrop and the screen-edge vignette.
  const skyGrad = ctx.createLinearGradient(0, -8, 0, H / 2);
  skyGrad.addColorStop(0, "#07080c"); skyGrad.addColorStop(1, "#1b211a");
  const floorGrad = ctx.createLinearGradient(0, H / 2, 0, H + 8);
  floorGrad.addColorStop(0, "#20241d"); floorGrad.addColorStop(1, "#0e0f10");
  const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.72);
  vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,0.55)");

  // ---- Tunables (MVP integration config; round/level scaling arrives with those modules) ----
  const FOV = 0.66;            // camera-plane half-width (~66° field of view)
  const MOVE = 2.8;            // player units / second
  const TURN = 2.6;            // arrow-key turn radians / second (mouse edge-zones also turn)
  const EDGE = 0.12;          // fraction of screen width on each side that steers the view
  const EDGE_TURN = 2.8;      // max turn radians / second at the very edge (free-aim 360°)
  const MAX_VIEW = 16;         // distance fog falls off over this many cells
  const MAX_SHAKE_PX = 5;      // peak screen-shake translation (px) at full trauma
  const CORPSE_MS = 700;       // how long a slain zombie's body fades on the floor

  const ZOMBIE_HP = 150;       // MVP placeholder until rounds.js scales HP per round
  const ZOMBIE_SPEED = 1.15;   // map cells / second (slower than the player, so you can kite)
  const CONTACT_RANGE = 0.6;   // how close a zombie must be to claw you
  const CONTACT_DAMAGE = 50;   // spec: two claws down a 100-HP player (survival owns the math)
  const HIT_COOLDOWN_MS = 750; // per-zombie delay between claws
  const SPAWN_POINTS = [
    { x: 13.5, y: 1.5 }, { x: 13.5, y: 13.5 }, { x: 1.5, y: 10.5 },
    { x: 8.5, y: 13.5 }, { x: 5.5, y: 13.5 },
  ];
  const MAX_ALIVE = 5;
  const SPAWN_INTERVAL = 2.2;  // seconds between spawns while under the cap

  const WALL_COLORS = [null, [176, 58, 58], [70, 120, 70], [70, 100, 150]];
  const FOG = [16, 20, 16];     // distant walls fade toward this sickly tone, not black
  const rgb = (r, g, b) => "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";

  // ---- Mutable game state (player matches the frozen GameState contract) ----
  let player, zombies, nextZombieId, spawnTimer, gameOver, muzzleFlash, hitMarker, nowMs;
  let trauma, popups, blood, sparks;   // game-juice state: screen shake, +N popups, particles
  let hitFlash, corpses, bobPhase, recoil, moving;   // actor-feel state (flash/death/bob/kick)
  // The crosshair tracks the real cursor (in canvas pixels); the gun aims at it.
  let cursorX = W / 2, cursorY = H / 2;

  function freshPlayer() {
    const w = WEAPONS.m1911;
    return {
      x: 2.5, y: 2.5, angle: 0.4,
      hp: 100, maxHp: 100, points: 500,
      weapon: "m1911",
      ammo: { m1911: { mag: w.magSize, reserve: w.reserve } },
      lastShotMs: undefined, reloadTimer: undefined, lastDamageMs: -1e9,
      perks: new Set(),
    };
  }

  function reset() {
    player = freshPlayer();
    zombies = [];
    nextZombieId = 1;
    spawnTimer = 0.5;
    gameOver = false;
    muzzleFlash = 0;
    hitMarker = 0;
    nowMs = 0;
    trauma = 0; popups = []; blood = []; sparks = [];
    hitFlash = {}; corpses = []; bobPhase = 0; recoil = 0; moving = false;
    overlay.classList.remove("show");
  }
  reset();

  // ---- Input ----
  const keys = Object.create(null);
  addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "KeyR" && !gameOver) tryStartReload();
    if (e.code === "Enter" && gameOver) reset();
  });
  addEventListener("keyup", (e) => { keys[e.code] = false; });

  // No pointer-lock: the visible cursor drives the gun. Map the page pointer into
  // canvas pixels so the crosshair lines up with the column the raycaster renders.
  function trackCursor(e) {
    const r = canvas.getBoundingClientRect();
    cursorX = Math.max(0, Math.min(W, ((e.clientX - r.left) / r.width) * W));
    cursorY = Math.max(0, Math.min(H, ((e.clientY - r.top) / r.height) * H));
  }
  addEventListener("mousemove", trackCursor);

  // Trigger discipline (input glue): auto weapons fire while held, semi-autos once
  // per click. weapons.fire still enforces the rpm cadence; the FIRST click fires.
  let triggerHeld = false, triggerEdge = false;
  canvas.addEventListener("mousedown", (e) => {
    trackCursor(e);
    if (gameOver) { reset(); return; }
    triggerHeld = true; triggerEdge = true;
  });
  addEventListener("mouseup", () => { triggerHeld = false; });
  overlay.addEventListener("mousedown", () => { if (gameOver) reset(); });

  // ---- Weapon-state composition seam (per docs/agents/README.md) ----
  // weapons.* operate on a flat { id, mag, reserve, reloadTimer, lastShotMs };
  // compose it from the player, run the module, then write the fields back.
  function composeWeapon() {
    const a = player.ammo[player.weapon];
    return { id: player.weapon, mag: a.mag, reserve: a.reserve,
             reloadTimer: player.reloadTimer, lastShotMs: player.lastShotMs };
  }
  function writeWeapon(s) {
    player = {
      ...player,
      ammo: { ...player.ammo, [player.weapon]: { mag: s.mag, reserve: s.reserve } },
      reloadTimer: s.reloadTimer, lastShotMs: s.lastShotMs,
    };
  }
  function tryStartReload() { writeWeapon(startReload(composeWeapon(), nowMs)); }

  // ---- Simulation: fixed timestep. All rules come from the imported modules. ----
  function simulate(dt) {
    nowMs += dt * 1000;

    // Turn: cursor edge-zones steer the view for full 360° (arrow keys still work).
    let turn = 0;
    const lz = EDGE * W, rz = (1 - EDGE) * W;
    if (cursorX < lz) turn -= EDGE_TURN * (1 - cursorX / lz);
    else if (cursorX > rz) turn += EDGE_TURN * ((cursorX - rz) / (W - rz));
    if (keys.ArrowLeft) turn -= TURN;
    if (keys.ArrowRight) turn += TURN;
    if (turn !== 0) player = { ...player, angle: player.angle + turn * dt };

    // Movement: W/S forward/back, A/D strafe (kiting preserved).
    const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
    let mx = 0, my = 0;
    if (keys.KeyW) { mx += dirX; my += dirY; }
    if (keys.KeyS) { mx -= dirX; my -= dirY; }
    if (keys.KeyA) { mx += dirY; my -= dirX; }   // strafe left
    if (keys.KeyD) { mx -= dirY; my += dirX; }   // strafe right
    const len = Math.hypot(mx, my);
    if (len > 0) {
      const p = moveWithCollision(MAP, player.x, player.y,
        (mx / len) * MOVE * dt, (my / len) * MOVE * dt);
      player = { ...player, x: p.x, y: p.y };
    }
    moving = len > 0;
    if (moving) bobPhase += dt * 9;       // view-bob advances with the player's strides

    // Free-aim: derive the shot direction from the same camera ray the renderer uses
    // for the crosshair's column, so the bullet lands exactly where the crosshair sits.
    const cameraX = (2 * cursorX) / W - 1;
    const aimAngle = Math.atan2(dirY + dirX * FOV * cameraX, dirX - dirY * FOV * cameraX);

    // Reload progress (completes once weapons' internal timer elapses).
    writeWeapon(tickReload(composeWeapon(), nowMs));

    // Firing: weapons.fire gates cadence/ammo; shooting.resolveShot picks the target.
    const weapon = WEAPONS[player.weapon];
    const wantFire = weapon.auto ? triggerHeld : triggerEdge;
    triggerEdge = false;
    if (wantFire) {
      const ws = composeWeapon();
      if (ws.mag === 0 && ws.reloadTimer === undefined) {
        writeWeapon(startReload(ws, nowMs));      // pull the trigger on empty → auto-reload
      } else {
        const { state, didFire } = fireWeapon(ws, nowMs);
        if (didFire) {
          writeWeapon(state);
          muzzleFlash = 0.05;
          recoil = 1;                             // weapon kick + crosshair bloom
          trauma = Math.min(1, trauma + 0.16);    // every shot kicks the camera a little
          const res = resolveShot(MAP, player, zombies, weapon, aimAngle);
          if (res.scoreDelta > 0) {
            // Find the zombie this hitscan shot damaged (single target) to place its juice.
            let hz = null;
            for (const z of res.zombies) {
              const before = zombies.find((q) => q.id === z.id);
              if (before && z.hp < before.hp) { hz = z; break; }
            }
            if (hz) {
              hitFlash[hz.id] = nowMs;                                // white flash on the hit
              blood = spawnBloodPuff(blood, hz.x, hz.y);              // spray at the world hit
              const pr = projectSprite(player, FOV, W, H, hz);
              if (pr.visible) popups = spawnPopup(popups, pr.screenX, pr.drawStartY, res.scoreDelta);
              if (res.killedId != null) corpses.push({ x: hz.x, y: hz.y, bornMs: nowMs });
              trauma = Math.min(1, trauma + (res.killedId != null ? 0.3 : 0.12));
            }
            player = earn(player, res.scoreDelta);
            hitMarker = 0.12;
          } else {
            // Missed every zombie → the bullet bites a wall; spark where it lands.
            const ca = Math.cos(aimAngle), sa = Math.sin(aimAngle);
            const wh = castRay(MAP, player.x, player.y, ca, sa);
            const d = Math.min(wh.perpWallDist, MAX_VIEW);
            sparks = spawnSpark(sparks, player.x + ca * d, player.y + sa * d);
          }
          zombies = res.zombies.filter((z) => z.hp > 0);
        }
      }
    }

    // Zombies chase, decay their claw cooldown, then claw the player on contact.
    zombies = zombies.map((z) => {
      const moved = stepZombie(MAP, z, player, dt, z.speed);
      return { ...moved, hitCooldown: Math.max(0, (z.hitCooldown || 0) - dt * 1000) };
    });
    for (let i = 0; i < zombies.length; i++) {
      const z = zombies[i];
      if (z.hitCooldown <= 0 && Math.hypot(z.x - player.x, z.y - player.y) < CONTACT_RANGE) {
        player = applyContactDamage(player, CONTACT_DAMAGE, nowMs);
        zombies[i] = { ...z, hitCooldown: HIT_COOLDOWN_MS };
        trauma = Math.min(1, trauma + 0.5);          // getting clawed shakes hard
      }
    }

    // Passive health regen (survival owns the 2s-delay / 3s-refill curve).
    player = regen(player, nowMs);

    // Trickle spawner (placeholder until rounds.js drives real waves).
    spawnTimer -= dt;
    if (spawnTimer <= 0 && zombies.length < MAX_ALIVE) {
      spawnTimer = SPAWN_INTERVAL;
      const s = SPAWN_POINTS[(Math.random() * SPAWN_POINTS.length) | 0];
      zombies.push({ id: nextZombieId++, x: s.x, y: s.y, angle: 0,
                     hp: ZOMBIE_HP, speed: ZOMBIE_SPEED, state: "chase", hitCooldown: 0 });
    }

    trauma = tickShake(trauma, dt);                  // trauma decays; shake follows
    blood = tickParticles(blood, dt);
    sparks = tickParticles(sparks, dt);
    popups = tickPopups(popups, dt);
    recoil = Math.max(0, recoil - dt * 6);           // recoil settles in ~0.16s
    corpses = corpses.filter((c) => nowMs - c.bornMs < CORPSE_MS);
    for (const id in hitFlash) if (nowMs - hitFlash[id] > 200) delete hitFlash[id];
    if (muzzleFlash > 0) muzzleFlash -= dt;
    if (hitMarker > 0) hitMarker -= dt;
    if (isGameOver(player)) endGame();
  }

  function endGame() {
    gameOver = true;
    overlay.innerHTML = "YOU DIED<small>Score " + player.points +
      " · click or press Enter to restart</small>";
    overlay.classList.add("show");
  }

  // ---- Render ----
  const zbuffer = new Float64Array(W);   // per-column wall depth, for sprite occlusion

  function render() {
    const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
    const planeX = -dirY * FOV, planeY = dirX * FOV;

    // The world layer shakes with trauma; the UI layer (weapon, crosshair, HUD) stays steady.
    const sh = shakeOffset(Math.min(1, trauma), MAX_SHAKE_PX);
    const ov = MAX_SHAKE_PX + 2;                  // overscan so a shake never bares an edge
    ctx.save();
    ctx.translate(sh.x, sh.y);

    ctx.fillStyle = skyGrad; ctx.fillRect(-ov, -ov, W + 2 * ov, H / 2 + ov);     // ceiling
    ctx.fillStyle = floorGrad; ctx.fillRect(-ov, H / 2, W + 2 * ov, H / 2 + ov); // floor

    // Torch flicker: a subtle global light wobble applied to the wall shading.
    const flicker = 0.85 + 0.1 * (0.5 + 0.5 * Math.sin(nowMs * 0.012)) + (Math.random() - 0.5) * 0.05;

    for (let x = 0; x < W; x++) {
      const cameraX = (2 * x) / W - 1;
      const rdx = dirX + planeX * cameraX, rdy = dirY + planeY * cameraX;
      const hit = castRay(MAP, player.x, player.y, rdx, rdy);
      const dist = Math.max(hit.perpWallDist, 0.0001);
      zbuffer[x] = dist;

      const lineHeight = H / dist;
      const sliceTop = -lineHeight / 2 + H / 2;      // unclamped top, for texture coords
      let drawStart = Math.floor(sliceTop);
      let drawEnd = Math.floor(lineHeight / 2 + H / 2);
      if (drawStart < 0) drawStart = 0;
      if (drawEnd > H) drawEnd = H;

      // Fractional hit position along the wall face (0..1) → horizontal texture coord.
      let wallX = hit.side === 0 ? player.y + dist * rdy : player.x + dist * rdx;
      wallX -= Math.floor(wallX);

      // Per-cell tint (so adjacent bricks differ) + a vertical mortar groove.
      const cellHash = ((hit.mapX * 73856093) ^ (hit.mapY * 19349663)) >>> 0;
      const tint = 0.85 + (cellHash & 255) / 255 * 0.3;
      const vmortar = wallX % 0.5 < 0.045 ? 0.6 : 1;
      const fog = Math.min(1, Math.pow(dist / MAX_VIEW, 1.3));
      const light = (hit.side === 1 ? 0.7 : 1) * flicker * tint * vmortar;

      const base = WALL_COLORS[hit.wall] || WALL_COLORS[1];
      // Fade the lit colour toward the sickly fog tone with distance (not toward black).
      ctx.fillStyle = rgb(
        base[0] * light * (1 - fog) + FOG[0] * fog,
        base[1] * light * (1 - fog) + FOG[1] * fog,
        base[2] * light * (1 - fog) + FOG[2] * fog);
      ctx.fillRect(x, drawStart, 1, drawEnd - drawStart);

      // Brick courses + a band of ground ambient occlusion (only when the slice is tall).
      if (drawEnd - drawStart > 6) {
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        for (let c = 1; c < 4; c++) {
          const my = Math.floor(sliceTop + (c / 4) * lineHeight);
          if (my > drawStart && my < drawEnd) ctx.fillRect(x, my, 1, 1);
        }
        const aoH = Math.max(1, (drawEnd - drawStart) * 0.06);
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(x, drawEnd - aoH, 1, aoH);
      }
    }

    drawCorpses();
    drawZombies();
    drawParticles();
    ctx.restore();                 // end the world-shake layer; UI below is steady

    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);   // darken the screen edges
    drawWeapon();
    if (nowMs - player.lastDamageMs < 350) drawHurt();
    drawEdgeHint();
    drawPopups();
    drawCrosshair();
    drawMinimap();
  }

  // Billboard zombies as a hunched humanoid silhouette (head, shoulders, dangling arms,
  // legs), depth-clipped per column. White flash on a fresh hit; a slow lurching sway.
  function drawZombies() {
    for (const p of projectSprites(player, FOV, W, H, zombies)) {
      const z = p.sprite;
      const top = p.drawStartY, h = p.drawEndY - p.drawStartY;
      const fullW = p.scale * 0.5;
      const left = Math.floor(p.screenX - fullW / 2);
      const right = Math.ceil(p.screenX + fullW / 2);
      const span = right - left;
      const sway = Math.sin(nowMs * 0.005 + z.id * 1.7) * 0.06;   // lurch in u-space
      const fog = Math.max(0.25, 1 - p.depth / MAX_VIEW);
      const flash = nowMs - (hitFlash[z.id] || -1e9) < 110;
      const body = flash ? [235, 238, 235] : [66, 92, 60];        // rotting greens, or
      const limb = flash ? [220, 224, 220] : [52, 70, 48];        // near-white on a hit
      const head = flash ? [240, 240, 235] : [120, 118, 96];

      for (let x = left; x < right; x++) {
        if (x < 0 || x >= W || p.depth >= zbuffer[x]) continue;   // wall occludes
        const u = (span <= 1 ? 0.5 : (x - left) / span) - sway;
        if ((u > 0.34 && u < 0.46) || (u > 0.54 && u < 0.66)) {   // legs
          const s = fog * 0.8;
          ctx.fillStyle = rgb(limb[0] * s, limb[1] * s, limb[2] * s);
          ctx.fillRect(x, top + h * 0.62, 1, h * 0.38);
        }
        if ((u > 0.16 && u < 0.30) || (u > 0.70 && u < 0.84)) {   // dangling arms
          const s = fog * 0.85;
          ctx.fillStyle = rgb(limb[0] * s, limb[1] * s, limb[2] * s);
          ctx.fillRect(x, top + h * 0.26, 1, h * 0.34);
        }
        if (u > 0.30 && u < 0.70) {                               // hunched torso
          const s = (0.7 + 0.3 * (1 - Math.abs(u - 0.5) * 2)) * fog;
          ctx.fillStyle = rgb(body[0] * s, body[1] * s, body[2] * s);
          ctx.fillRect(x, top + h * 0.22, 1, h * 0.42);
        }
        if (u > 0.40 && u < 0.60) {                               // head
          ctx.fillStyle = rgb(head[0] * fog, head[1] * fog, head[2] * fog);
          ctx.fillRect(x, top + h * 0.04, 1, h * 0.20);
        }
      }
      // Glowing eyes, locked to the head's swaying centre so they never slide off the face.
      const cxi = Math.floor(p.screenX);
      if (!flash && h > 8 && cxi >= 0 && cxi < W && p.depth < zbuffer[cxi]) {
        const hc = p.screenX + sway * span;          // head centre tracks the same lurch
        const sep = Math.max(1, fullW * 0.07);       // half the gap between the two eyes
        const ew = Math.max(1, fullW * 0.05), eh = Math.max(1, h * 0.03);
        const ey = top + h * 0.12;                   // drop them onto the eye line
        ctx.fillStyle = "rgba(255,70,45,0.30)";      // dim halo for a sickly glow
        ctx.fillRect(hc - sep - ew, ey - eh, ew * 2, eh * 3);
        ctx.fillRect(hc + sep - ew, ey - eh, ew * 2, eh * 3);
        ctx.fillStyle = "#ff3024";                   // hot pupils, mirrored about the centre
        ctx.fillRect(hc - sep - ew, ey, ew, eh);
        ctx.fillRect(hc + sep, ey, ew, eh);
      }
    }
  }

  // Slain zombies leave a dark mound that collapses to the floor and fades over CORPSE_MS.
  function drawCorpses() {
    for (const c of corpses) {
      const life = (nowMs - c.bornMs) / CORPSE_MS;
      if (life >= 1) continue;
      const pr = projectSprite(player, FOV, W, H, c);
      if (!pr.visible) continue;
      const h = pr.drawEndY - pr.drawStartY;
      const fullW = pr.scale * 0.5;
      const left = Math.floor(pr.screenX - fullW / 2);
      const right = Math.ceil(pr.screenX + fullW / 2);
      const fog = Math.max(0.25, 1 - pr.depth / MAX_VIEW);
      const a = (1 - life) * fog;
      const top = pr.drawStartY + h * (0.55 + 0.4 * life);        // sinks as it fades
      ctx.fillStyle = "rgba(" + ((58 * fog) | 0) + "," + ((26 * fog) | 0) + "," +
        ((26 * fog) | 0) + "," + a.toFixed(3) + ")";
      for (let x = left; x < right; x++) {
        if (x < 0 || x >= W || pr.depth >= zbuffer[x]) continue;
        ctx.fillRect(x, top, 1, pr.drawEndY - top);
      }
    }
  }

  function drawWeapon() {
    const gunW = W * 0.22, gunH = H * 0.18;
    const kick = recoil * 6;                              // recoil drops the gun down/back
    const bobX = Math.cos(bobPhase) * (moving ? 2.5 : 0.6);
    const bobY = Math.abs(Math.sin(bobPhase)) * (moving ? 3 : 0.8);
    const gx = W / 2 + (cursorX - W / 2) * 0.5 + bobX;   // leans toward the cursor + sways
    const gy = H - gunH + kick + bobY;

    // Muzzle flash briefly floods the lower scene with warm light.
    if (muzzleFlash > 0) {
      ctx.fillStyle = "rgba(255,230,150," + ((muzzleFlash / 0.05) * 0.22).toFixed(3) + ")";
      ctx.fillRect(0, H * 0.5, W, H * 0.5);
    }
    ctx.fillStyle = "#15151b";
    ctx.fillRect(gx - gunW * 0.22, gy + gunH * 0.10, gunW * 0.44, gunH);   // grip / body
    ctx.fillStyle = "#23232e";
    ctx.fillRect(gx - gunW * 0.10, gy - gunH * 0.05, gunW * 0.20, gunH * 0.5); // slide
    ctx.fillStyle = "#0e0e14";
    ctx.fillRect(gx - 2.5, gy - gunH * 0.32, 5, gunH * 0.42);              // barrel
    if (muzzleFlash > 0) {
      const r = 5 + recoil * 6, fy = gy - gunH * 0.34;
      const g = ctx.createRadialGradient(gx, fy, 0, gx, fy, r);
      g.addColorStop(0, "rgba(255,250,210,0.95)");
      g.addColorStop(1, "rgba(255,170,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(gx, fy, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHurt() {
    const a = 0.5 * (1 - (nowMs - player.lastDamageMs) / 350);
    ctx.fillStyle = "rgba(190,20,20," + a.toFixed(3) + ")";
    ctx.fillRect(0, 0, W, 6); ctx.fillRect(0, H - 6, W, 6);
    ctx.fillRect(0, 0, 6, H); ctx.fillRect(W - 6, 0, 6, H);
  }

  function drawCrosshair() {
    const cx = cursorX, cy = cursorY;
    const spread = 2 + recoil * 5 + (moving ? 1.5 : 0);   // gap blooms when firing/moving
    ctx.strokeStyle = "rgba(230,235,245,0.9)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - spread - 3, cy); ctx.lineTo(cx - spread, cy);
    ctx.moveTo(cx + spread, cy); ctx.lineTo(cx + spread + 3, cy);
    ctx.moveTo(cx, cy - spread - 3); ctx.lineTo(cx, cy - spread);
    ctx.moveTo(cx, cy + spread); ctx.lineTo(cx, cy + spread + 3);
    ctx.stroke();
    ctx.fillStyle = "rgba(230,235,245,0.9)";
    ctx.fillRect(cx, cy, 1, 1);               // centre dot
    if (hitMarker > 0) {                      // brief red X when a shot connects
      ctx.strokeStyle = "rgba(255,80,80,0.95)";
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy - 7); ctx.lineTo(cx - 3, cy - 3);
      ctx.moveTo(cx + 7, cy - 7); ctx.lineTo(cx + 3, cy - 3);
      ctx.moveTo(cx - 7, cy + 7); ctx.lineTo(cx - 3, cy + 3);
      ctx.moveTo(cx + 7, cy + 7); ctx.lineTo(cx + 3, cy + 3);
      ctx.stroke();
    }
  }

  // Faint bar on whichever edge the cursor is steering into, so turning reads clearly.
  function drawEdgeHint() {
    const lz = EDGE * W, rz = (1 - EDGE) * W;
    if (cursorX < lz) {
      ctx.fillStyle = "rgba(150,180,255," + (0.10 + 0.22 * (1 - cursorX / lz)).toFixed(3) + ")";
      ctx.fillRect(0, 0, 3, H);
    } else if (cursorX > rz) {
      ctx.fillStyle = "rgba(150,180,255," + (0.10 + 0.22 * ((cursorX - rz) / (W - rz))).toFixed(3) + ")";
      ctx.fillRect(W - 3, 0, 3, H);
    }
  }

  // CoD-style radar: a player-centred circular minimap. North is up (the compass
  // letters are fixed); the yellow triangle and FOV cone show where you're looking.
  function drawMinimap() {
    const R = 30, cx = W - R - 6, cy = R + 6;     // radar centre, tucked top-right
    const s = 4;                                  // pixels per map cell
    const half = Math.atan(FOV);                  // FOV half-angle for the look cone

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = "rgba(6,11,8,0.82)"; ctx.fill();
    ctx.clip();                                   // everything below is masked to the dish

    // Look cone — a faint wedge in the direction you face.
    ctx.fillStyle = "rgba(255,225,120,0.10)";
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, player.angle - half, player.angle + half); ctx.closePath(); ctx.fill();

    // Walls, drawn relative to the player so the dish scrolls under a fixed centre.
    ctx.fillStyle = "#3a5547";
    for (let y = 0; y < MAP_H; y++)
      for (let x = 0; x < MAP_W; x++) {
        if (!MAP[y][x]) continue;
        ctx.fillRect(cx + (x + 0.5 - player.x) * s - s / 2,
                     cy + (y + 0.5 - player.y) * s - s / 2, s, s);
      }

    // Zombie blips.
    ctx.fillStyle = "#ff4040";
    for (const z of zombies) {
      const bx = cx + (z.x - player.x) * s, by = cy + (z.y - player.y) * s;
      ctx.fillRect(bx - 1.5, by - 1.5, 3, 3);
    }
    ctx.restore();                                // drop the clip for the overlay chrome

    // Player facing triangle at the centre (angle 0 = +x = East = screen-right).
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(player.angle);
    ctx.fillStyle = "#ffe14a";
    ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // Bezel + cardinal compass (north-up, so the letters stay put).
    ctx.strokeStyle = "rgba(180,200,190,0.55)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.font = "bold 7px ui-monospace, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffec6a"; ctx.fillText("N", cx, cy - R + 6);
    ctx.fillStyle = "rgba(220,230,225,0.85)";
    ctx.fillText("S", cx, cy + R - 6);
    ctx.fillText("E", cx + R - 5, cy);
    ctx.fillText("W", cx - R + 5, cy);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  // Blood puffs (red) and wall sparks (gold): world-space points, depth-clipped against
  // the wall buffer like the zombie billboards, drawn as little fading squares.
  function drawParticles() {
    for (const list of [blood, sparks]) {
      const red = list === blood;
      for (const pt of list) {
        const pr = projectSprite(player, FOV, W, H, pt);
        if (!pr.visible) continue;
        const col = Math.floor(pr.screenX);
        if (col < 0 || col >= W || pr.depth >= zbuffer[col]) continue;   // wall occludes
        const life = Math.max(0, 1 - pt.age / pt.ttl);
        const cy = (pr.drawStartY + pr.drawEndY) / 2;
        const sz = Math.max(1, pr.scale * 0.03);
        ctx.fillStyle = red
          ? "rgba(180,30,30," + life.toFixed(3) + ")"
          : "rgba(255,210,120," + life.toFixed(3) + ")";
        ctx.fillRect(pr.screenX - sz / 2, cy - sz / 2, sz, sz);
      }
    }
  }

  // Floating "+N" score numbers (screen-space; they detach at the hit and rise as they fade).
  function drawPopups() {
    ctx.font = "bold 9px ui-monospace, monospace";
    ctx.textAlign = "center";
    for (const p of popups) {
      const a = Math.max(0, 1 - p.age / p.ttl);
      ctx.fillStyle = "rgba(255,213,74," + a.toFixed(3) + ")";
      ctx.fillText("+" + p.value, p.x, p.y);
    }
    ctx.textAlign = "left";
  }

  // ---- HUD + fixed-timestep loop ----
  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;

  function updateHud() {
    const a = player.ammo[player.weapon];
    const w = WEAPONS[player.weapon];
    const reloading = player.reloadTimer !== undefined;
    if (player.points !== lastPoints) {                 // pop the score when it changes
      pointsEl.textContent = player.points;
      pointsEl.classList.remove("pop"); void pointsEl.offsetWidth; pointsEl.classList.add("pop");
      lastPoints = player.points;
    }
    magEl.textContent = reloading ? "··" : a.mag;
    reserveEl.textContent = "/ " + a.reserve;
    weaponEl.textContent = w.name + (reloading ? " — RELOADING" : a.mag === 0 ? " — RELOAD (R)" : "");
    ammoEl.classList.toggle("empty", a.mag === 0 && !reloading);
    // Classic Nacht has no health bar — the screen edges bleed when you're low.
    lowhpEl.classList.toggle("show", player.hp > 0 && player.hp / player.maxHp < 0.34);
  }

  function frame(t) {
    let dt = (t - last) / 1000; last = t;
    if (dt > 0.25) dt = 0.25;        // clamp after a tab-switch to avoid a spiral
    acc += dt;
    while (acc >= STEP) { if (!gameOver) simulate(STEP); acc -= STEP; }
    render();
    updateHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  </script>
</body>
</html>
